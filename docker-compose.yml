# n8n (imagen oficial de github.com/n8n-io/n8n) + Postgres para su propio estado
# + túnel de Cloudflare opcional para exponer los webhooks.
#
#   cp .env.example .env    # y llena los valores
#   docker compose up -d                      # n8n en http://localhost:5678
#   docker compose --profile tunnel up -d     # además, URL pública temporal

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?Define N8N_DB_PASSWORD en .env}
    volumes:
      - n8n_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"   # solo localhost; lo público entra por el túnel
    environment:
      # Estado de n8n en Postgres, no en SQLite.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # Cifra las credenciales guardadas en n8n. Si se pierde, se pierden las credenciales.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en .env}
      GENERIC_TIMEZONE: America/Mexico_City
      TZ: America/Mexico_City
      N8N_DEFAULT_LOCALE: en
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_PROXY_HOPS: 1
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Los workflows leen configuración NO secreta desde variables H4U_* / WHATSAPP_*.
      # Los secretos (service_role, token de Meta, secreto del webhook) van en
      # credenciales de n8n, cifradas con N8N_ENCRYPTION_KEY.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      H4U_SUPABASE_URL: ${H4U_SUPABASE_URL:?Define H4U_SUPABASE_URL en .env}
      # Llave pública (anon / publishable), la misma que usa el frontend. No es secreta.
      H4U_SUPABASE_ANON_KEY: ${H4U_SUPABASE_ANON_KEY:-}
      GEMINI_API_BASE: ${GEMINI_API_BASE:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      H4U_OPERATOR_PHONE: ${H4U_OPERATOR_PHONE:-}
      H4U_UNASSIGNED_MINUTES: ${H4U_UNASSIGNED_MINUTES:-30}
      H4U_UNACKNOWLEDGED_MINUTES: ${H4U_UNACKNOWLEDGED_MINUTES:-30}
      WHATSAPP_API_BASE: ${WHATSAPP_API_BASE:-https://graph.facebook.com/v25.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_MESSAGE_MODE: ${WHATSAPP_MESSAGE_MODE:-template}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-hello_world}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en_US}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [n8n]
    # Quick tunnel: URL https://<algo>.trycloudflare.com que cambia en cada arranque.
    # Ver la URL: docker compose logs tunnel | grep trycloudflare
    command: tunnel --no-autoupdate --url http://n8n:5678

volumes:
  n8n_db:
  n8n_data:
